<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HITDS Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l6 2.5v4C14 11 11.4 14 8 15 4.6 14 2 11 2 7.5v-4z' fill='%2358a6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<form class="panel login" method="post">
  <div class="brand"><span class="logo">HITDS</span></div>
  <p class="muted">Human-in-the-Loop Intrusion Detection · analyst console · <b>{{ dataset }}</b></p>
  {% if error %}<p class="pill bad">{{ error }}</p>{% endif %}
  <label>Username<input name="username" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Sign in</button>
  <p class="muted small">Every sign-in, verdict and action is written to a hash-chained audit log.</p>
</form>
</body>
</html>
